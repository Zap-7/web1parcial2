<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Órbita Física | Contacto</title>
</head>

<body>
    <!-- Página de contacto -->
    <a href="#inicio" class="volver-arriba" title="Volver arriba">↑</a>
    <header id="inicio">
        <h1>Órbita Física</h1>
        <h2>Ponete en contacto con nosotros!</h2>
        <p>Tenés sugerencias, dudas o comentarios? Escribinos.</p>
    </header>

    <nav class="menu">
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li>
                <a href="#">Contenido</a>
                <ul class="submenu">
                    <li><a href="articulo.html">Artículo</a></li>
                    <li><a href="laboratorio.html">Laboratorio</a></li>
                </ul>
            </li>
            <li><a href="contacto.html">Contacto</a></li>
        </ul>
    </nav>

    <hr>

    <main class="contenedor">
        <section>
            <h3>Formulario de contacto</h3>

            <form action="#" method="post">

                <label for="nombre">Nombre:</label>
                <input class="form-control" type="text" id="nombre" name="nombre" required>

                <label for="apellido">Apellido:</label>
                <input class="form-control" type="text" id="apellido" name="apellido" required>

                <label for="correo">Correo electrónico:</label>
                <input class="form-control" type="email" id="correo" name="correo" required>

                <label for="asunto">Asunto:</label>
                <input class="form-control" type="text" id="asunto" name="asunto">

                <label for="categoria">Categoría:</label>
                <select class="form-control" id="categoria" name="categoria" required>
                    <option disabled value="" selected disabled>Seleccioná una opción</option>
                    <option>Consulta</option>
                    <option>Sugerencia</option>
                    <option>Error en la revista</option>
                </select>

                <label for="tema">Tema de interés:</label>
                <input class="form-control" list="temas" id="tema" name="tema">

                <datalist id="temas">
                    <option value="Mecánica">
                    <option value="Relatividad">
                    <option value="Física cuántica">
                    <option value="Astrofísica">
                </datalist>

                <label for="fecha">Fecha de la consulta:</label>
                <input class="form-control" type="date" id="fecha" name="fecha">

                <label for="edad">Edad:</label>
                <input class="form-control" type="number" id="edad" name="edad" min="1" max="120" step="1">

                <label for="mensaje">Mensaje:</label>
                <textarea class="form-control" id="mensaje" name="mensaje" rows="6" required></textarea>

                <button type="submit" class="btn btn-primary">Enviar</button>

            </form>

        </section>
    </main>

    <footer id="pie">
        <p>Gracias por visitar Revista Física.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
